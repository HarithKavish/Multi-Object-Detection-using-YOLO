name: Convert Model to TensorFlow.js

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    convert:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  pip install ultralytics onnx onnx2tf tensorflow==2.15.0 tensorflowjs protobuf==3.20.3 onnxruntime onnxsim sng4onnx

            - name: Train CNN Model
              run: |
                  python main.py

            - name: Verify H5 file exists
              run: |
                  ls -lh yolov8n.onnx
                  echo "ONNX export successful"

            - name: Convert ONNX to TensorFlow SavedModel
              run: |
                  onnx2tf -i yolov8n.onnx -o yolov8_savedmodel/ -osd
                  echo "TensorFlow conversion complete"

            - name: Convert to TensorFlow.js using H5 format
              run: |
                  tensorflowjs_converter --input_format=tf_saved_model --output_format=tfjs_graph_model yolov8_savedmodel/ tfjs_model/

            - name: Verify conversion
              run: |
                  ls -lh tfjs_model/
                  echo "Conversion successful"

            - name: Upload TensorFlow.js model
              uses: actions/upload-artifact@v4
              with:
                  name: tfjs-model
                  path: tfjs_model/

            - name: Commit and push tfjs_model
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add -f tfjs_model/
                  git commit -m "Update TensorFlow.js model [skip ci]" || echo "No changes to commit"
                  git push || echo "Nothing to push"
