name: Convert Model to TensorFlow.js

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    convert:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  pip install tensorflow tensorflowjs opencv-python-headless numpy tqdm

            - name: Train CNN Model
              run: |
                  python main.py << EOF
                  5
                  EOF

            - name: Verify H5 file exists
              run: |
                  ls -lh image_classifier.*
                  echo "Files created successfully"

            - name: Convert to TensorFlow.js using H5 format
              run: |
                  tensorflowjs_converter --input_format=keras --skip_op_check image_classifier.h5 tfjs_model/

            - name: Verify conversion
              run: |
                  ls -lh tfjs_model/
                  echo "Conversion successful"

            - name: Upload TensorFlow.js model
              uses: actions/upload-artifact@v4
              with:
                  name: tfjs-model
                  path: tfjs_model/

            - name: Commit and push tfjs_model
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add -f tfjs_model/
                  git commit -m "Update TensorFlow.js model [skip ci]" || echo "No changes to commit"
                  git push || echo "Nothing to push"
