name: Convert Model to TensorFlow.js

# Run by hand when the model should be regenerated. It produces the TensorFlow.js model
# as a downloadable artifact; it does not commit it. The site serves the model committed
# at docs/tfjs_model/, and protected branches accept changes only through pull requests
# (governance BRANCHING.md, no bypass) -- to publish a new model, download the artifact
# and open a pull request replacing docs/tfjs_model/.
#
# It used to run on every push to main and push its output to a root tfjs_model/ folder
# the site never read, installing TensorFlow and retraining each time.

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    convert:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  pip install ultralytics onnx onnx2tf tensorflow==2.15.0 tensorflowjs protobuf==3.20.3 onnxruntime onnxsim sng4onnx

            - name: Train CNN Model
              run: |
                  python main.py

            - name: Verify H5 file exists
              run: |
                  ls -lh yolov8n.onnx
                  echo "ONNX export successful"

            - name: Convert ONNX to TensorFlow SavedModel
              run: |
                  onnx2tf -i yolov8n.onnx -o yolov8_savedmodel/ -osd
                  echo "TensorFlow conversion complete"

            - name: Convert to TensorFlow.js using H5 format
              run: |
                  tensorflowjs_converter --input_format=tf_saved_model --output_format=tfjs_graph_model yolov8_savedmodel/ tfjs_model/

            - name: Verify conversion
              run: |
                  ls -lh tfjs_model/
                  echo "Conversion successful"

            - name: Upload TensorFlow.js model
              uses: actions/upload-artifact@v4
              with:
                  name: tfjs-model
                  path: tfjs_model/
