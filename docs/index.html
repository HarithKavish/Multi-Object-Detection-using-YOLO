<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Object Detection using YOLO</title>

    <!-- Theme detection - BEFORE CSS to prevent flash -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (prefersDark && !savedTheme)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <link rel="stylesheet" href="style.css">
    <!-- Load TensorFlow.js and COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
    <!-- Neo AI Widget - Shared Loader -->
    <script src="https://harithkavish.github.io/widget-loader.js"></script>
</head>

<body>
    <script src="script_coco.js"></script>
</body>

</html>
